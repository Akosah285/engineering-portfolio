<?xml version="1.0" encoding="UTF-8"?>
<!--
  Bespoke About OG card (1200×630) — closes #9.

  Mirror of landing.svg's typographic grid (same wordmark slot, same Pine
  inline-start bar, same descriptor cadence) but the headline reads
  "About Akwasi Akosah" so the social preview is unambiguously the
  personal page.

  Rendered to public/og/about.png via scripts/render-bespoke-og.mjs.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fcfaf6"/>
      <stop offset="100%" stop-color="#f3f1ec"/>
    </linearGradient>
  </defs>

  <!-- Warm-paper background -->
  <rect width="1200" height="630" fill="url(#paper)"/>

  <!-- Pine inline-start accent bar -->
  <rect x="0" y="0" width="20" height="630" fill="#00693e"/>

  <!-- Wordmark (top-left) -->
  <g font-family="'Source Serif 4', Georgia, serif" font-weight="600" fill="#1a1a1a">
    <text x="80" y="98" font-size="28" letter-spacing="0.5">Akwasi Akosah</text>
  </g>
  <g font-family="Inter, Helvetica, sans-serif" font-weight="400" fill="#525252">
    <text x="80" y="128" font-size="20" letter-spacing="2.0" style="text-transform: uppercase;">ENGINEERING PORTFOLIO</text>
  </g>

  <!-- Hairline separator -->
  <line x1="80" y1="160" x2="280" y2="160" stroke="#00693e" stroke-width="2"/>

  <!-- Eyebrow -->
  <g font-family="Inter, Helvetica, sans-serif" fill="#00693e" font-weight="600">
    <text x="80" y="260" font-size="22" letter-spacing="3" style="text-transform: uppercase;">ABOUT</text>
  </g>

  <!-- Focal headline -->
  <g font-family="'Source Serif 4', Georgia, serif" fill="#1a1a1a">
    <text x="80" y="350" font-size="86" font-weight="700" letter-spacing="-1.5">About Akwasi Akosah</text>
  </g>

  <!-- Subtitle -->
  <g font-family="'Source Serif 4', Georgia, serif" fill="#3a3a3a" font-style="italic">
    <text x="80" y="420" font-size="32" font-weight="400">· engineering portfolio ·</text>
  </g>

  <!-- Bottom descriptor -->
  <g font-family="Inter, Helvetica, sans-serif" fill="#525252">
    <text x="80" y="555" font-size="24" font-weight="400">Why I built this · how the demos work · what comes next</text>
  </g>

  <!-- Bottom-right meta -->
  <g font-family="Inter, Helvetica, sans-serif" font-weight="500" fill="#1a1a1a" text-anchor="end">
    <text x="1140" y="555" font-size="22">Dartmouth · Thayer School</text>
  </g>
</svg>
