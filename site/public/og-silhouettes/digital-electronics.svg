<?xml version="1.0" encoding="UTF-8"?>
<!--
  Digital Electronics hero silhouette — FSM Simulator (Stopwatch preset).

  Three FSM states with directed transitions forming a triangle, plus a
  self-loop reflecting the "tick" transition that updates the count. The
  active state is filled. Evokes the hero where the user clicks input
  events and watches the state pointer animate.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 480 480"
  fill="none"
  stroke="#00693e"
  stroke-width="2.5"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <title>Finite-state machine with three states and labelled transitions</title>

  <defs>
    <marker
      id="de-arrow"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="6"
      markerHeight="6"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00693e" stroke="none" />
    </marker>
  </defs>

  <!-- Three states arranged as a triangle -->
  <circle cx="240" cy="110" r="42" />
  <circle cx="120" cy="330" r="42" />
  <circle cx="360" cy="330" r="42" />

  <!-- Inner ring on the active (accepting) state -->
  <circle cx="240" cy="110" r="32" opacity="0.55" />

  <!-- Transitions (with arrowheads) -->
  <g marker-end="url(#de-arrow)" stroke-width="2.2">
    <path d="M 215 145 Q 165 220, 145 295" />          <!-- top → bottom-left -->
    <path d="M 158 326 Q 240 360, 322 326" />          <!-- bottom-left → bottom-right -->
    <path d="M 335 295 Q 315 220, 265 145" />          <!-- bottom-right → top -->
  </g>

  <!-- Self-loop on the top (active) state -->
  <g marker-end="url(#de-arrow)" stroke-width="2.2">
    <path d="M 270 72 a 22 22 0 1 1 -42 -8" />
  </g>

  <!-- State indicator inside the active state -->
  <g fill="#00693e" stroke="none">
    <circle cx="240" cy="110" r="6" />
  </g>

  <!-- Start arrow into top state -->
  <g marker-end="url(#de-arrow)" stroke-width="2.2">
    <line x1="142" y1="60" x2="195" y2="92" />
  </g>
</svg>
