<?xml version="1.0" encoding="UTF-8"?>
<!--
  Solid Mechanics hero silhouette — Interactive Truss Analyzer.

  Classic three-bay roof-truss frame (top and bottom chords, web members,
  triangular bays) with a downward load arrow on the apex node. Evokes
  the hero demo where the user drags load magnitudes and watches axial
  forces redistribute through the members.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 480 480"
  fill="none"
  stroke="#00693e"
  stroke-width="2.5"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <title>Truss frame with applied load on the apex joint</title>

  <!-- Bottom chord (horizontal) -->
  <line x1="60" y1="340" x2="420" y2="340" stroke-width="3" />

  <!-- Top chord (peaked roof) -->
  <polyline points="60,340 240,180 420,340" stroke-width="3" />

  <!-- Vertical webs at joints -->
  <line x1="150" y1="260" x2="150" y2="340" />
  <line x1="240" y1="180" x2="240" y2="340" />
  <line x1="330" y1="260" x2="330" y2="340" />

  <!-- Diagonal webs forming the triangular bays -->
  <line x1="60"  y1="340" x2="240" y2="340" stroke-opacity="0" />
  <line x1="150" y1="260" x2="240" y2="340" />
  <line x1="330" y1="260" x2="240" y2="340" />
  <line x1="60"  y1="340" x2="150" y2="260" stroke-opacity="0" />

  <!-- Joints (pin connections) -->
  <g fill="#00693e" stroke="none">
    <circle cx="60"  cy="340" r="6" />
    <circle cx="150" cy="260" r="6" />
    <circle cx="240" cy="180" r="7" />
    <circle cx="330" cy="260" r="6" />
    <circle cx="420" cy="340" r="6" />
  </g>

  <!-- Load arrow on apex pointing down -->
  <g stroke-width="3.5">
    <line x1="240" y1="80" x2="240" y2="160" />
    <polyline points="226,148 240,168 254,148" stroke-linecap="round" />
  </g>

  <!-- Ground hatching under the supports -->
  <g stroke-width="2" opacity="0.7">
    <line x1="40"  y1="360" x2="80"  y2="360" />
    <line x1="44"  y1="370" x2="60"  y2="380" />
    <line x1="60"  y1="370" x2="76"  y2="380" />
    <line x1="400" y1="360" x2="440" y2="360" />
    <line x1="404" y1="370" x2="420" y2="380" />
    <line x1="420" y1="370" x2="436" y2="380" />
  </g>
</svg>
