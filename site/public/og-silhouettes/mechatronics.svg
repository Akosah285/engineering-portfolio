<?xml version="1.0" encoding="UTF-8"?>
<!--
  Mechatronics hero silhouette — PID Step Response Simulator.

  Step input (horizontal dashed reference) with the classic PID
  underdamped response: rise, overshoot, ringing, settle. Evokes the
  hero where the user adjusts Kp/Ki/Kd and watches the curve reshape.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 480 480"
  fill="none"
  stroke="#00693e"
  stroke-width="2.5"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <title>PID controller step response with overshoot and settling</title>

  <!-- Plot axes -->
  <g opacity="0.75" stroke-width="2">
    <line x1="70"  y1="80"  x2="70"  y2="400" />
    <line x1="70"  y1="400" x2="430" y2="400" />
  </g>

  <!-- Setpoint reference (dashed) -->
  <line
    x1="70" y1="200" x2="430" y2="200"
    stroke-dasharray="8 6"
    opacity="0.7"
  />

  <!-- Step input edge -->
  <polyline
    points="70,400 130,400 130,200"
    opacity="0.55"
    stroke-width="2"
  />

  <!-- PID step response: rise → overshoot → ringing → settle -->
  <path
    d="M 130 400
       C 150 400, 160 360, 170 300
       C 180 240, 210 90,  240 150
       C 270 210, 290 250, 310 200
       C 330 150, 350 220, 370 200
       L 430 200"
    stroke-width="3.5"
    opacity="0.95"
  />

  <!-- Overshoot peak marker -->
  <g fill="#00693e" stroke="none">
    <circle cx="218" cy="120" r="5" />
    <circle cx="430" cy="200" r="5" />
  </g>

  <!-- Annotation tick on Y axis at setpoint -->
  <line x1="62" y1="200" x2="78" y2="200" stroke-width="2" />
</svg>
