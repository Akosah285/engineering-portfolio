[project]
name = "ocr-vault"
version = "0.1.0"
description = "OCR pipeline for engineering coursework — PDF → JSON sidecars + SQLite index"
requires-python = ">=3.12"
dependencies = [
    "pillow>=12.2.0",
    "pypdfium2>=5.8.0",
    "rich>=15.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
ocr-vault = "ocr_vault.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocr_vault"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/ocr_vault", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
]
