name: Build, test, and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  site:
    name: Site (lint, test, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack and activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm --version

      - name: Setup Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Approve build scripts
        run: pnpm rebuild

      - name: Lint (Biome)
        run: pnpm run lint

      - name: Run tests (Vitest)
        run: pnpm run test

      - name: Type check
        run: pnpm run typecheck

      - name: Astro check
        run: pnpm run check

      - name: Build site
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
        run: pnpm run build

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  ocr-vault:
    name: ocr-vault (Python tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/ocr-vault
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install ocr-vault (with dev extras)
        run: uv pip install --system -e ".[dev]"

      - name: Run pytest
        run: pytest -q

      - name: Ruff lint
        run: ruff check src tests

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [site, ocr-vault]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
